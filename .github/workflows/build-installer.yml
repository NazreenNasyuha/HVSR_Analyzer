name: Build installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Run test suite
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.x"

      - name: Install dependencies
        run: pip install --quiet pillow==11.3.0
        # pillow is only used by installer/make_icon.py (icon generation);
        # the application itself is pure standard library.

      # Each test file runs as its own step so a failure shows exactly
      # which file broke (the unittest files already print verbose output).
      - name: Run test_engine.py
        run: python tests/test_engine.py

      - name: Run test_io.py
        run: python tests/test_io.py

      - name: Run test_extras.py
        run: python tests/test_extras.py

      - name: Run test_inversion.py
        run: python tests/test_inversion.py

      - name: Run test_gui.py
        run: python tests/test_gui.py

      - name: Verify icon generator
        run: |
          python installer/make_icon.py
          python -c "from PIL import Image; im = Image.open('installer/HVSR_Analyzer.png'); assert im.size == (256, 256); print('icon OK', im.size)"
          # No git-diff check here: Pillow's rendering is not byte-identical
          # across wheel builds (conda vs PyPI wheels of the SAME version
          # produce different bytes), so diffing regenerated icons fails CI
          # spuriously.  The committed icons are the source of truth; this
          # step only smoke-tests make_icon.py and validates the PNG output.

  build:
    name: Build installer
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build standalone app with PyInstaller
        # Packages the app with a private Python runtime + tkinter, so the
        # installer ships an exe that needs no Python on the target machine.
        run: |
          pip install --quiet pyinstaller==6.22.0
          python scripts/build_exe.py

      - name: Download Inno Setup 6
        shell: pwsh
        run: |
          $url = "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe"
          $exe = Join-Path $env:TEMP "innosetup-6.7.3.exe"
          Invoke-WebRequest -Uri $url -OutFile $exe
          Start-Process -FilePath $exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-" -Wait

      - name: Compile installer
        # Bundles dist/HVSR_Analyzer (the PyInstaller build from the step
        # above) plus examples/docs; see installer/HVSR_Analyzer_Setup.iss
        shell: pwsh
        run: |
          $candidates = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe",
            (Join-Path $env:LOCALAPPDATA "Programs\Inno Setup 6\ISCC.exe")
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found" }
          Write-Host "Using $iscc"
          & $iscc "installer/HVSR_Analyzer_Setup.iss"

      - name: Upload setup artifact
        uses: actions/upload-artifact@v4
        with:
          name: HVSR_Analyzer_Setup
          path: installer/Output/HVSR_Analyzer_Setup.exe
          if-no-files-found: error

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Output/HVSR_Analyzer_Setup.exe
          generate_release_notes: true
          # Tolerate a release/asset created beforehand (e.g. by a manual
          # `gh release create`) and refresh it with the CI-built installer.
          overwrite: true
